services:
  caddy:
    image: caddy:2-alpine
    container_name: tecno-plus-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  wppconnect:
    image: wppconnect/wppconnect-server:${WPP_SERVER_TAG:-latest}
    container_name: tecno-plus-wppconnect
    restart: unless-stopped
    env_file: .env
    environment:
      SECRET_KEY: ${WPPCONNECT_SECRET_KEY:?WPPCONNECT_SECRET_KEY deve ser configurado}
      PORT: 21465
      WEBHOOK_URL: ${WPPCONNECT_WEBHOOK_URL:-}
      START_ALL_SESSIONS: 'true'
      TOKEN_STORE_TYPE: file
      CUSTOM_USER_DATA_DIR: /usr/src/wpp-server/userDataDir
    volumes:
      - wppconnect-tokens:/usr/src/wpp-server/tokens
      - wppconnect-user-data:/usr/src/wpp-server/userDataDir
      - wppconnect-uploads:/usr/src/wpp-server/uploads
      - wppconnect-images:/usr/src/wpp-server/WhatsAppImages
      - wppconnect-logs:/usr/src/wpp-server/log
    expose:
      - '21465'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:$${PORT:-21465}/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: tecno-plus-backend:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: tecno-plus-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3333
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI deve apontar para o MongoDB Atlas}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-tecnoplus}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SHOPEE_REDIRECT_URL: ${SHOPEE_REDIRECT_URL}
    volumes:
      - ./apps/backend/local-templates:/app/apps/backend/local-templates:ro
    expose:
      - '3333'

  bot:
    image: tecno-plus-backend:latest
    container_name: tecno-plus-bot
    restart: unless-stopped
    command: ['node', 'apps/backend/dist/telegram.js']
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI deve apontar para o MongoDB Atlas}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-tecnoplus}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./apps/backend/local-templates:/app/apps/backend/local-templates:ro

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_APP_URL}
    container_name: tecno-plus-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_APP_URL}
    expose:
      - '3000'

volumes:
  caddy-data:
  caddy-config:
  wppconnect-tokens:
  wppconnect-user-data:
  wppconnect-uploads:
  wppconnect-images:
  wppconnect-logs:
