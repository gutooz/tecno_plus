name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEPLOY_HOST: 72.61.24.80
      DEPLOY_PORT: 22
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build
        run: npm run build

      - name: Check deploy secrets
        shell: bash
        run: |
          test -n "$VPS_USER" || (echo "Missing secret VPS_USER" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing secret VPS_SSH_KEY" && exit 1)
          test -n "$PROD_ENV_FILE" || (echo "Missing secret PROD_ENV_FILE" && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 30 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err || {
            echo "ssh-keyscan could not pre-load the VPS host key; SSH will try accept-new on first connection."
            cat /tmp/ssh-keyscan.err
          }
          ssh -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$DEPLOY_HOST" "echo SSH connection ok"

      - name: Prepare env file
        shell: bash
        run: |
          printf '%s\n' "$PROD_ENV_FILE" > .deploy-env

      - name: Sync files to VPS
        shell: bash
        run: |
          PORT="$DEPLOY_PORT"
          APP_DIR="${VPS_APP_DIR:-/opt/tecno-plus}"
          SSH_CMD="ssh -p $PORT -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new"
          $SSH_CMD "$VPS_USER@$DEPLOY_HOST" "mkdir -p '$APP_DIR'"
          $SSH_CMD "$VPS_USER@$DEPLOY_HOST" "test -f '$APP_DIR/.env' && cp '$APP_DIR/.env' /tmp/tecno-plus-env-before-deploy || true"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '*.tsbuildinfo' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.deploy-env' \
            --exclude '.codex-local' \
            -e "$SSH_CMD" \
            ./ "$VPS_USER@$DEPLOY_HOST:$APP_DIR/"
          scp -P "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new \
            .deploy-env "$VPS_USER@$DEPLOY_HOST:$APP_DIR/.env"
          $SSH_CMD "$VPS_USER@$DEPLOY_HOST" "python3 - <<'PY'
          from pathlib import Path

          app_env = Path('$APP_DIR/.env')
          previous_env = Path('/tmp/tecno-plus-env-before-deploy')
          preserve_keys = {
              'TOKEN_ENCRYPTION_KEY',
              'MONGODB_URI',
              'MONGODB_DATABASE',
              'MONGODB_MIN_POOL_SIZE',
              'MONGODB_MAX_POOL_SIZE',
              'MONGODB_SERVER_SELECTION_TIMEOUT_MS',
              'MONGODB_CONNECT_TIMEOUT_MS',
              'MONGODB_SOCKET_TIMEOUT_MS',
              'MONGO_URI',
              'MONGO_DB_NAME',
              'TELEGRAM_BOT_TOKEN',
              'TELEGRAM_CHAT_ID',
              'TELEGRAM_OWNER_ID',
              'TELEGRAM_BOT_USERNAME',
              'SHOPEE_PARTNER_ID',
              'SHOPEE_PARTNER_KEY',
              'SHOPEE_ENVIRONMENT',
              'SHOPEE_REGION',
              'SHOPEE_API_HOST',
              'SHOPEE_AUTH_HOST',
              'SHOPEE_REDIRECT_URL',
              'SHOPEE_WEBHOOK_URL',
              'ASAAS_API_KEY',
              'ASAAS_ENVIRONMENT',
              'ASAAS_API_URL',
              'ASAAS_PLATFORM_FEE',
          }

          def parse_env(path):
              data = {}
              if not path.exists():
                  return data
              for line in path.read_text().splitlines():
                  if '=' not in line or line.lstrip().startswith('#'):
                      continue
                  key, value = line.split('=', 1)
                  data[key.strip()] = value
              return data

          current = parse_env(app_env)
          previous = parse_env(previous_env)
          if previous:
              lines = app_env.read_text().splitlines()
              seen = set()
              out = []
              for line in lines:
                  if '=' in line and not line.lstrip().startswith('#'):
                      key = line.split('=', 1)[0].strip()
                      if key in preserve_keys:
                          value = current.get(key, '')
                          if not value and previous.get(key):
                              line = f'{key}={previous[key]}'
                          seen.add(key)
                  out.append(line)
              for key in preserve_keys - seen:
                  if previous.get(key):
                      out.append(f'{key}={previous[key]}')
              app_env.write_text('\n'.join(out) + '\n')
          previous_env.unlink(missing_ok=True)
          PY"
          $SSH_CMD "$VPS_USER@$DEPLOY_HOST" "find '$APP_DIR' -name '*.tsbuildinfo' -not -path '$APP_DIR/node_modules/*' -delete"

      - name: Docker compose up
        shell: bash
        run: |
          PORT="$DEPLOY_PORT"
          APP_DIR="${VPS_APP_DIR:-/opt/tecno-plus}"
          SSH_CMD="ssh -p $PORT -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new"
          $SSH_CMD "$VPS_USER@$DEPLOY_HOST" "
            set -e
            cd '$APP_DIR'
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
          "

      - name: Health check
        shell: bash
        run: |
          APP_URL="$(printf '%s\n' "$PROD_ENV_FILE" | awk -F= '/^PUBLIC_APP_URL=/{print $2}' | tail -n1)"
          if [ -z "$APP_URL" ]; then
            DOMAIN="$(printf '%s\n' "$PROD_ENV_FILE" | awk -F= '/^APP_DOMAIN=/{print $2}' | tail -n1)"
            APP_URL="https://$DOMAIN"
          fi
          curl --fail --retry 10 --retry-delay 6 "$APP_URL/api/health"
